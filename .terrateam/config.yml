# .terrateam/config.yml

tags:
  dest_branch:
    main: "^main$"
    develop: "^develop$"
    poc: "^poc$"

dirs:
  "terraform":
    tags: ["azure-standard"]

destination_branches:
  - "main"
  - "poc"
  - "develop"

engine:
  name: terraform
  version: "1.14.5"

hooks:
  plan:
    post:
      - type: run
        cmd:
          - 'sh'
          - '-c'
          - |
            PLAN_JSON=$$(terraform show -json "$TERRATEAM_PLAN_FILE")
            jq -n \
              --arg commit "$TERRATEAM_HEAD_SHA" \
              --arg target_branch "$TERRATEAM_BASE_REF" \
              --arg source_branch "$TERRATEAM_HEAD_REF" \
              --arg pr_number "$TERRATEAM_PR_NUMBER" \
              --arg pr_title "$TERRATEAM_PR_TITLE" \
              --arg repo_owner "$TERRATEAM_REPO_OWNER" \
              --arg repo_name "$TERRATEAM_REPO_NAME" \
              --arg dir "$TERRATEAM_DIR" \
              --arg workspace "$TERRATEAM_WORKSPACE" \
              --argjson plan "$$PLAN_JSON" \
              '{commit: $$commit, target_branch: $$target_branch, source_branch: $$source_branch, pr_number: $$pr_number, pr_title: $$pr_title, repo: ($$repo_owner + "/" + $$repo_name), dir: $$dir, workspace: $$workspace, plan: $$plan}' \
            | curl -s -X POST -H "Content-Type: application/json" -d @- http://terrateamplantest.ebb4cmfnbwexdmgy.francecentral.azurecontainer.io:8000/plans

workflows:
  # --- PRODUCTION (Main Branch) ---
  - tag_query: "azure-standard and dest_branch:main"
    plan:
      - type: env
        name: ARM_TENANT_ID
        cmd: ['echo', '${PROD_ARM_TENANT_ID}']
      - type: env
        name: ARM_SUBSCRIPTION_ID
        cmd: ['echo', '${PROD_ARM_SUBSCRIPTION_ID}']
      - type: env
        name: ARM_CLIENT_ID
        cmd: ['echo', '${PROD_ARM_CLIENT_ID}']
      - type: env
        name: ARM_CLIENT_SECRET
        cmd: ['echo', '${PROD_ARM_CLIENT_SECRET}']
        sensitive: true
      - type: init
        extra_args:
          - "-input=false"
          - "-reconfigure"
          - "-backend-config=resource_group_name=${PROD_TFSTATE_RG}"
          - "-backend-config=storage_account_name=${PROD_STORAGE}"
          - "-backend-config=container_name=tfstate"
          - "-backend-config=key=prod.terraform.tfstate"
      - type: plan
        extra_args: ["-var-file=prod.tfvars"]
    apply:
      - type: env
        name: ARM_TENANT_ID
        cmd: ['echo', '${PROD_ARM_TENANT_ID}']
      - type: env
        name: ARM_SUBSCRIPTION_ID
        cmd: ['echo', '${PROD_ARM_SUBSCRIPTION_ID}']
      - type: env
        name: ARM_CLIENT_ID
        cmd: ['echo', '${PROD_ARM_CLIENT_ID}']
      - type: env
        name: ARM_CLIENT_SECRET
        cmd: ['echo', '${PROD_ARM_CLIENT_SECRET}']
        sensitive: true
      - type: init
        extra_args:
          - "-input=false"
          - "-reconfigure"
          - "-backend-config=resource_group_name=${PROD_TFSTATE_RG}"
          - "-backend-config=storage_account_name=${PROD_STORAGE}"
          - "-backend-config=container_name=tfstate"
          - "-backend-config=key=prod.terraform.tfstate"
      - type: apply
        extra_args: ["-var-file=prod.tfvars"]

  # --- DEVELOP BRANCH ---
  - tag_query: "azure-standard and dest_branch:develop"
    plan:
      - type: env
        name: ARM_TENANT_ID
        cmd: ['echo', '${DEV_ARM_TENANT_ID}']
      - type: env
        name: ARM_SUBSCRIPTION_ID
        cmd: ['echo', '${DEV_ARM_SUBSCRIPTION_ID}']
      - type: env
        name: ARM_CLIENT_ID
        cmd: ['echo', '${DEV_ARM_CLIENT_ID}']
      - type: env
        name: ARM_CLIENT_SECRET
        cmd: ['echo', '${DEV_ARM_CLIENT_SECRET}']
        sensitive: true
      - type: init
        extra_args:
          - "-input=false"
          - "-reconfigure"
          - "-backend-config=resource_group_name=${DEV_TFSTATE_RG}"
          - "-backend-config=storage_account_name=${DEV_STORAGE}"
          - "-backend-config=container_name=tfstate"
          - "-backend-config=key=dev.terraform.tfstate"
      - type: plan
        extra_args: ["-var-file=dev.tfvars"]
    apply:
      - type: env
        name: ARM_TENANT_ID
        cmd: ['echo', '${DEV_ARM_TENANT_ID}']
      - type: env
        name: ARM_SUBSCRIPTION_ID
        cmd: ['echo', '${DEV_ARM_SUBSCRIPTION_ID}']
      - type: env
        name: ARM_CLIENT_ID
        cmd: ['echo', '${DEV_ARM_CLIENT_ID}']
      - type: env
        name: ARM_CLIENT_SECRET
        cmd: ['echo', '${DEV_ARM_CLIENT_SECRET}']
        sensitive: true
      - type: init
        extra_args:
          - "-input=false"
          - "-reconfigure"
          - "-backend-config=resource_group_name=${DEV_TFSTATE_RG}"
          - "-backend-config=storage_account_name=${DEV_STORAGE}"
          - "-backend-config=container_name=tfstate"
          - "-backend-config=key=dev.terraform.tfstate"
      - type: apply
        extra_args: ["-var-file=dev.tfvars"]

  # --- POC BRANCH ---
  - tag_query: "azure-standard and dest_branch:poc"
    plan:
      - type: env
        name: ARM_TENANT_ID
        cmd: ['echo', '${POC_ARM_TENANT_ID}']
      - type: env
        name: ARM_SUBSCRIPTION_ID
        cmd: ['echo', '${POC_ARM_SUBSCRIPTION_ID}']
      - type: env
        name: ARM_CLIENT_ID
        cmd: ['echo', '${POC_ARM_CLIENT_ID}']
      - type: env
        name: ARM_CLIENT_SECRET
        cmd: ['echo', '${POC_ARM_CLIENT_SECRET}']
        sensitive: true
      - type: init
        extra_args:
          - "-input=false"
          - "-reconfigure"
          - "-backend-config=resource_group_name=${POC_TFSTATE_RG}"
          - "-backend-config=storage_account_name=${POC_STORAGE}"
          - "-backend-config=container_name=tfstate"
          - "-backend-config=key=poc.terraform.tfstate"
      - type: plan
        extra_args: ["-var-file=poc.tfvars"]
    apply:
      - type: env
        name: ARM_TENANT_ID
        cmd: ['echo', '${POC_ARM_TENANT_ID}']
      - type: env
        name: ARM_SUBSCRIPTION_ID
        cmd: ['echo', '${POC_ARM_SUBSCRIPTION_ID}']
      - type: env
        name: ARM_CLIENT_ID
        cmd: ['echo', '${POC_ARM_CLIENT_ID}']
      - type: env
        name: ARM_CLIENT_SECRET
        cmd: ['echo', '${POC_ARM_CLIENT_SECRET}']
        sensitive: true
      - type: init
        extra_args:
          - "-input=false"
          - "-reconfigure"
          - "-backend-config=resource_group_name=${POC_TFSTATE_RG}"
